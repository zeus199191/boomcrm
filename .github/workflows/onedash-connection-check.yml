name: OneDash API connection check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - .github/workflows/onedash-connection-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check API authorization without exposing credentials
        env:
          ONEDASH_API_KEY: ${{ secrets.ONEDASH_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ONEDASH_API_KEY" ]; then echo "::error::ONEDASH_API_KEY secret is missing"; exit 1; fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base='https://api.rdp-onedash.ru/api'
          headers={'Authorization':'Bearer '+os.environ['ONEDASH_API_KEY'],'Accept':'application/json'}
          for endpoint in ('auth/check','vps'):
              req=urllib.request.Request(base+'/'+endpoint,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=15) as response:
                      result=json.load(response)
                      if not result.get('type'):
                          raise RuntimeError('API returned type=false')
                      if endpoint=='auth/check':
                          print('api_authorization=ok')
                      else:
                          items=result.get('data',{}).get('items',[])
                          print('vps_list_access=ok')
                          print('vps_count='+str(len(items)))
                          # Print only an allowlisted, non-sensitive status summary
                          # for the target VPS. Never dump the full API response.
                          target='89.125.121.183'
                          matches=[]
                          for item in items:
                              if not isinstance(item,dict):
                                  continue
                              addresses=[str(item.get(k,'')) for k in ('ip','ip_address','ipv4','address','main_ip')]
                              nested=item.get('ips')
                              if isinstance(nested,list):
                                  for entry in nested:
                                      if isinstance(entry,str): addresses.append(entry)
                                      elif isinstance(entry,dict):
                                          addresses.extend(str(entry.get(k,'')) for k in ('ip','address','ipv4'))
                              if any(target==addr for addr in addresses):
                                  matches.append(item)
                          # Show field names and safe shape hints only; never print values
                          # that might contain credentials, access URLs or tokens.
                          for idx,item in enumerate(items):
                              if not isinstance(item,dict):
                                  print('vps_'+str(idx)+'_record_type='+type(item).__name__)
                                  continue
                              print('vps_'+str(idx)+'_field_names='+','.join(sorted(str(k) for k in item.keys())))
                              for key in ('ip','ip_address','ipv4','address','main_ip','ips','network','networking','addresses'):
                                  if key in item:
                                      value=item[key]
                                      if isinstance(value,dict):
                                          print('vps_'+str(idx)+'_'+key+'_subfields='+','.join(sorted(str(k) for k in value.keys())))
                                      elif isinstance(value,list):
                                          print('vps_'+str(idx)+'_'+key+'_list_length='+str(len(value)))
                                          if value and isinstance(value[0],dict):
                                              print('vps_'+str(idx)+'_'+key+'_item_fields='+','.join(sorted(str(k) for k in value[0].keys())))
                                      else:
                                          print('vps_'+str(idx)+'_'+key+'_value_type='+type(value).__name__)
                          # OneDash often nests address information under connection.
                          # Match the known VPS ID without logging any raw connection values.
                          target_id='374527'
                          for idx,item in enumerate(items):
                              if not isinstance(item,dict):
                                  continue
                              conn=item.get('connection')
                              if isinstance(conn,dict):
                                  print('vps_'+str(idx)+'_connection_fields='+','.join(sorted(str(k) for k in conn.keys())))
                              else:
                                  print('vps_'+str(idx)+'_connection_type='+type(conn).__name__)
                              if str(item.get('id',''))==target_id and item not in matches:
                                  matches.append(item)
                              if isinstance(conn,dict):
                                  for k in ('ip','ip_address','ipv4','address','host','hostname','server_ip'):
                                      v=conn.get(k)
                                      if isinstance(v,str) and v.strip()=='89.125.121.183' and item not in matches:
                                          matches.append(item)
                          print('target_vps_found='+str(bool(matches)).lower())
                          if matches:
                              item=matches[0]
                              for key in ('status','state','power_state','is_running','is_active'):
                                  value=item.get(key)
                                  if isinstance(value,bool) or (isinstance(value,str) and value.lower() in ('running','stopped','active','inactive','online','offline','on','off','suspended','unknown')):
                                      print('target_'+key+'='+str(value).lower())
                              print('target_status_fields_present='+','.join(k for k in ('status','state','power_state','is_running','is_active') if k in item))
                          else:
                              print('target_match_note=API may use a different address field; no changes made')
              except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError,ValueError,RuntimeError) as e:
                  print('api_'+endpoint.replace('/','_')+'=failed')
                  print('error_type='+type(e).__name__)
                  raise SystemExit(1)
          PY
